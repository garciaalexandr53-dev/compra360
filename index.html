<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const isFuncionarios = window.location.pathname.startsWith("/app-funcionarios");
        const search = new URLSearchParams(window.location.search);
        const token = search.get("__lovable_token");
        const appTitle = isFuncionarios ? "Compra360 Funcionários" : "Compra360";
        const manifestBase = isFuncionarios ? "/manifest-funcionarios.json" : "/manifest.json";
        const manifestHref = token
          ? `${manifestBase}?__lovable_token=${encodeURIComponent(token)}`
          : manifestBase;

        document.title = appTitle;

        let manifest = document.querySelector('link[rel="manifest"]');
        if (!manifest) {
          manifest = document.createElement("link");
          manifest.setAttribute("rel", "manifest");
          document.head.appendChild(manifest);
        }
        manifest.setAttribute("href", manifestHref);

        let appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (!appleTitle) {
          appleTitle = document.createElement("meta");
          appleTitle.setAttribute("name", "apple-mobile-web-app-title");
          document.head.appendChild(appleTitle);
        }
        appleTitle.setAttribute("content", appTitle);
      })();
    </script>
