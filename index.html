<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const path = window.location.pathname;
        const isFuncionarios = path.startsWith("/app-funcionarios") || path.startsWith("/reposicao");
        const search = new URLSearchParams(window.location.search);
        const tokenFromSearch = search.get("__lovable_token");
        const tokenFromHref = window.location.href.match(/[?&]__lovable_token=([^&#]+)/)?.[1] || null;
        const token = tokenFromSearch || (tokenFromHref ? decodeURIComponent(tokenFromHref) : null);

        const appTitle = isFuncionarios ? "Compra360 Reposição" : "Compra360";
        const manifestBase = isFuncionarios ? "/manifest-funcionarios.json" : "/manifest.json";
        const manifestHref = token
          ? `${manifestBase}?__lovable_token=${encodeURIComponent(token)}`
          : manifestBase;

        window.__compra360HeadConfig = { appTitle, manifestHref };

        let manifest = document.querySelector('link[rel="manifest"]');
        if (!manifest) {
          manifest = document.createElement("link");
          manifest.setAttribute("rel", "manifest");
          document.head.appendChild(manifest);
        }
        manifest.setAttribute("href", manifestHref);
      })();
    </script>

    <script>
      (() => {
        const config = window.__compra360HeadConfig;
        if (!config) return;
        document.title = config.appTitle;
        const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleTitle) appleTitle.setAttribute("content", config.appTitle);
        const manifest = document.querySelector('link[rel="manifest"]');
        if (manifest) manifest.setAttribute("href", config.manifestHref);
      })();
    </script>
